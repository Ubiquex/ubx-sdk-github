name: hash-watch

# Weekly check against the real, live GitHub OpenAPI spec URL for content
# drift. GitHub publishes no discrete, pinnable release for this spec (the
# schema_url points at a live main branch) -- there is no version number
# to poll the way version-watch.yml does for the four Terraform-provider-
# sourced repos (ubx-sdk-aws/-google/-kubernetes/-azure). Instead: re-fetch
# the same spec bytes, hash them, and compare against VERSION's committed
# spec-sha256. On a hash change: bumps VERSION, re-runs
# `ubx sdk gen --lang go|ts|py --out .` against it (all three languages,
# one PR), and opens a PR with the combined diff for review. Never
# auto-merges, same as every other repo in this org.
#
# Ported from ubx-sdk-google's own version-watch.yml (the real, working
# reference for the combined-repo layout and the regen/build steps), with
# the version-source swapped from a Terraform Registry API poll to a
# spec-hash comparison, and an extra `ubx-provider-dynamic` checkout added
# -- dynamic providers (schema_source = "openapi") need a local
# ubx-provider-dynamic build to resolve at all (cli/dynamicprovider.go's
# UBX_PROVIDER_DYNAMIC_REPO convention), unlike a thirdparty Terraform
# provider, which ubx sdk gen acquires on its own.
#
# 1.1.0: schema_url repointed from api.github.com's own description to
# GitHub's own ghec description (GitHub Enterprise Cloud) -- this file's
# own fetch/regen/VERSION-write steps were never updated to match at the
# time, leaving all three still hardcoded to the pre-repoint path. A
# workflow left in that state would fetch and hash the WRONG spec,
# almost certainly never match VERSION's own (correctly ghec-based)
# committed hash, always conclude the corpus changed, and regenerate
# from the stale api.github.com spec -- silently reverting this repo
# from 80 resources back to 68. Fixed here, all three references now
# point at ghec, matching VERSION and the real, currently-configured
# [dynamic_providers.github] in ubiquex.

on:
  schedule:
    - cron: "0 6 * * 1" # every Monday, 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out ubx-sdk-github
        uses: actions/checkout@v4

      - name: Fetch the real GitHub OpenAPI spec and hash it
        id: spec
        run: |
          set -euo pipefail
          url="https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/ghec/ghec.json"
          curl -sf "$url" -o /tmp/spec.bin
          hash="$(sha256sum /tmp/spec.bin | awk '{print $1}')"
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Live spec sha256: $hash"

      - name: Compare against this repo's committed hash
        id: compare
        run: |
          set -euo pipefail
          current="$(grep '^spec-sha256:' VERSION | awk '{print $2}')"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "This repo was last generated from spec-sha256: $current"
          if [ "$current" = "${{ steps.spec.outputs.hash }}" ]; then
            echo "newer=false" >> "$GITHUB_OUTPUT"
            echo "Already current -- nothing to do."
          else
            echo "newer=true" >> "$GITHUB_OUTPUT"
          fi

      # --- everything below only runs when the spec content changed ---

      - name: Check out ubiquex (to build ubx from source)
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          # Both ubiquex and ubx-provider-dynamic are public repos -- a
          # plain, unauthenticated clone, no token needed. (Formerly a
          # fine-grained UBIQUEX_SOURCE_TOKEN PAT, before either repo was
          # made public; that secret was never actually set on this repo,
          # confirmed directly via the API, so this checkout always failed
          # here regardless of whether a real change was ever found.)
          #
          # --recurse-submodules: real, found-live bug (on ubx-sdk-google's
          # own copy of the multi-source version of this file) -- ubiquex's
          # own sdk/go, sdk/py, sdk/ts are real git submodules; a bare
          # clone leaves them empty and `go build ./cmd/ubx` below fails.
          # Applied here too since this checkout has the identical
          # dependency, even though it wasn't caught live on this specific
          # repo (this repo's own compare step has always found the corpus
          # unchanged in every real test run so far, so this checkout's
          # own real dependents were never actually exercised here either).
          git clone --depth=1 --recurse-submodules \
            "https://github.com/Ubiquex/ubiquex.git" \
            "${{ runner.temp }}/ubiquex-src"
          git clone --depth=1 \
            "https://github.com/Ubiquex/ubx-provider-dynamic.git" \
            "${{ runner.temp }}/ubx-provider-dynamic-src"

      - name: Set up Go
        if: steps.compare.outputs.newer == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/ubiquex-src/go.mod

      - name: Set up Deno
        if: steps.compare.outputs.newer == 'true'
        uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: "2.x"

      - name: Set up Python
        if: steps.compare.outputs.newer == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build ubx
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          go build -C "${{ runner.temp }}/ubiquex-src" -o "${{ runner.temp }}/ubx" ./cmd/ubx
          "${{ runner.temp }}/ubx" version

      - name: Regenerate bindings (all three languages)
        if: steps.compare.outputs.newer == 'true'
        env:
          UBX_PROVIDER_DYNAMIC_REPO: ${{ runner.temp }}/ubx-provider-dynamic-src
        run: |
          set -euo pipefail
          gendir="${{ runner.temp }}/ubxgen"
          mkdir -p "$gendir/.ubx"
          cat > "$gendir/.ubx/config" <<EOF
          [dynamic_providers.github]
          schema_source = "openapi"
          schema_url = "https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/ghec/ghec.json"
          base_url = "https://api.github.com"
          EOF

          # Each language's own semver `version` field is owned by
          # publish.yml, not by codegen -- codegen always writes "0.0.0".
          # Capture the real, currently-committed values before regen
          # overwrites them, restore after.
          own_ts_version="$(python3 -c "import json; print(json.load(open('sdk/typescript/package.json'))['version'])")"
          own_py_version="$(python3 -c "import tomllib; print(tomllib.load(open('sdk/python/pyproject.toml','rb'))['project']['version'])")"

          # Seed the scratch output's own go.mod with this repo's real,
          # already-checked-out go.mod before generation runs (matches
          # ubx-sdk-google's own version-watch.yml, UBI-153).
          mkdir -p "$gendir/out/github/sdk/go"
          cp sdk/go/go.mod "$gendir/out/github/sdk/go/go.mod"

          ( cd "$gendir" && "${{ runner.temp }}/ubx" sdk gen --only github --lang go --out out )
          ( cd "$gendir" && "${{ runner.temp }}/ubx" sdk gen --only github --lang ts --out out )
          ( cd "$gendir" && "${{ runner.temp }}/ubx" sdk gen --only github --lang py --out out )

          # go.sum, deno.json/deno.lock are hand/tooling-maintained, not
          # codegen output, and are excluded from the regeneration diff.
          rsync -a --delete \
            --exclude='go.sum' \
            "$gendir/out/github/sdk/go/" sdk/go/
          rsync -a --delete \
            --exclude='deno.json' --exclude='deno.lock' \
            "$gendir/out/github/sdk/typescript/" sdk/typescript/
          rsync -a --delete \
            "$gendir/out/github/sdk/python/" sdk/python/

          python3 -c "
          import json
          p = 'sdk/typescript/package.json'
          d = json.load(open(p))
          d['version'] = '$own_ts_version'
          json.dump(d, open(p, 'w'), indent=2)
          open(p, 'a').write('\n')
          "
          python3 -c "
          import re
          p = 'sdk/python/pyproject.toml'
          content = open(p).read()
          content = re.sub(r'version = \"[^\"]+\"', 'version = \"$own_py_version\"', content, count=1)
          open(p, 'w').write(content)
          "

          cat > VERSION <<EOF
          spec-sha256: ${{ steps.spec.outputs.hash }}
          fetched: $(date -u +%Y-%m-%d)
          source: https://raw.githubusercontent.com/github/rest-api-description/main/descriptions/ghec/ghec.json
          EOF

      - name: Refresh sdk/typescript/deno.json's exports map for the regenerated tree
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          python3 - <<'PYEOF'
          import json, os

          with open("sdk/typescript/deno.json") as fh:
              cfg = json.load(fh)

          exports = {}
          for dirpath, _, filenames in os.walk("sdk/typescript/github"):
              for f in sorted(filenames):
                  if not f.endswith(".ts"):
                      continue
                  rel = os.path.relpath(os.path.join(dirpath, f), "sdk/typescript")
                  exports["./" + rel[:-3]] = "./" + rel

          cfg["exports"] = exports

          with open("sdk/typescript/deno.json", "w") as fh:
              json.dump(cfg, fh, indent=2)
              fh.write("\n")

          print(f"sdk/typescript/deno.json exports: {len(exports)} entries")
          PYEOF

      - name: Regenerate sdk/go/go.sum
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          cd sdk/go
          go mod tidy

      - name: Sanity-check the regenerated Go tree still builds
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          cd sdk/go
          go build ./...
          go vet ./...

      - name: Sanity-check the regenerated TS tree still typechecks
        if: steps.compare.outputs.newer == 'true'
        run: |
          set -euo pipefail
          cd sdk/typescript
          find . -name "*.ts" -print0 | xargs -0 deno cache
          find . -name "*.ts" -print0 | xargs -0 deno check --frozen

      - name: Sanity-check the regenerated Python tree -- real import of every module
        if: steps.compare.outputs.newer == 'true'
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          deps="$(cd sdk/python && python3 -c "import tomllib; print(' '.join(tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']))")"
          pip install $deps
          python3 - <<'PYEOF'
          import os, sys, importlib

          repo_root = os.path.join(os.getcwd(), "sdk", "python")
          sys.path.insert(0, repo_root)

          count = 0
          errors = []
          for dirpath, dirnames, filenames in os.walk(repo_root):
              for f in filenames:
                  if not f.endswith(".py"):
                      continue
                  rel = os.path.relpath(os.path.join(dirpath, f), repo_root)
                  mod = rel[:-3].replace(os.sep, ".")
                  if mod.endswith(".__init__"):
                      mod = mod[: -len(".__init__")]
                  try:
                      importlib.import_module(mod)
                      count += 1
                  except Exception as e:
                      errors.append((mod, str(e)))

          print(f"imported {count} modules OK")
          if errors:
              print(f"{len(errors)} ERRORS:")
              for m, e in errors:
                  print(f"  {m}: {e}")
              sys.exit(1)
          print("ZERO errors")
          PYEOF

      - name: Open PR
        if: steps.compare.outputs.newer == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "ubx-bot"
          git config user.email "actions@users.noreply.github.com"
          short="$(echo "${{ steps.spec.outputs.hash }}" | cut -c1-12)"
          branch="sdk-regen/github-$short"
          git checkout -b "$branch"
          git add -A
          git commit -m "sdk: regenerate from github spec $short"
          git push origin "$branch" --force
          gh pr create \
            --title "sdk: regenerate from github spec $short" \
            --body "Automated regeneration (\`.github/workflows/hash-watch.yml\`) triggered by a spec content change on GitHub's live \`main\`-branch OpenAPI description -- all three languages (sdk/go/, sdk/typescript/, sdk/python/) regenerated together in this one PR.

          Previous spec-sha256: \`${{ steps.compare.outputs.current }}\`
          New spec-sha256: \`${{ steps.spec.outputs.hash }}\`

          New files = new resource. Modified files = an existing resource's schema changed. This never auto-merges -- review the diff before merging." \
            --base main --head "$branch"
